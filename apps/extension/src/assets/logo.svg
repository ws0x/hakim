<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />

  <!-- Left Page -->
  <path d="M 64 88 C 46 80 28 84 22 88 L 22 42 C 28 38 46 34 64 42 Z" fill="url(#bookGrad)" opacity="0.95" />

  <!-- Right Page -->
  <path d="M 64 88 C 82 80 100 84 106 88 L 106 42 C 100 38 82 34 64 42 Z" fill="url(#bookGrad)" opacity="0.8" />

  <!-- Spine / Center Highlight -->
  <path d="M 64 42 L 64 88" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" />

  <!-- Core Wisdom Spark -->
  <g filter="url(#glow)">
    <polygon points="64,22 69,32 79,37 69,42 64,52 59,42 49,37 59,32" fill="url(#sparkGrad)" />
    <circle cx="64" cy="37" r="2.5" fill="#ffffff" />
  </g>
</svg>
